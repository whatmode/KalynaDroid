name: Build Kalyna native Arch package

on:
  push:
    branches: [main]
    paths:
      - "kalyna/native/**"
      - ".github/workflows/build-steam-deck-native.yml"
  pull_request:
    paths:
      - "kalyna/native/**"
      - ".github/workflows/build-steam-deck-native.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: steam-deck-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build x86_64 pacman package
    runs-on: ubuntu-24.04
    container:
      image: archlinux:latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Arch build dependencies
        run: |
          pacman -Syu --noconfirm --needed
          pacman -S --noconfirm --needed \
            base-devel cmake ninja pkgconf \
            qt6-base qt6-declarative qt6-wayland qt6-shadertools \
            qt6-svg qt6-virtualkeyboard python

      - name: Build package with makepkg
        run: |
          set -euo pipefail
          useradd --create-home builder
          printf 'builder ALL=(ALL) NOPASSWD: ALL\\n' > /etc/sudoers.d/builder
          chmod 0440 /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -c "cd '$GITHUB_WORKSPACE/kalyna/native/packaging' && makepkg --syncdeps --noconfirm --cleanbuild"

      - name: Verify package
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(kalyna/native/packaging/kalyna-native-*.pkg.tar.zst)
          test "${#packages[@]}" -eq 1
          pacman -Qip "${packages[0]}"
          mkdir -p dist
          cp "${packages[0]}" dist/
          sha256sum dist/*.pkg.tar.zst > dist/SHA256SUMS

      - name: Upload pacman package
        uses: actions/upload-artifact@v4
        with:
          name: kalyna-native-arch-x86_64
          path: dist/*
          if-no-files-found: error
          retention-days: 30
