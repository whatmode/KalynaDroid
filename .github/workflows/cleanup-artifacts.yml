name: Delete ALL Actions artifacts

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only; do not delete"
        required: true
        default: true
        type: boolean
      confirm_delete:
        description: "Set true to confirm deletion of every artifact in this repository"
        required: true
        default: false
        type: boolean

permissions:
  actions: write

concurrency:
  group: delete-all-actions-artifacts
  cancel-in-progress: false

jobs:
  cleanup:
    name: Preview or delete every artifact
    runs-on: ubuntu-latest
    steps:
      - name: List and optionally delete all artifacts
        uses: actions/github-script@v7
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          CONFIRM_DELETE: ${{ inputs.confirm_delete }}
        with:
          script: |
            const dryRun = process.env.DRY_RUN === 'true';
            const confirmed = process.env.CONFIRM_DELETE === 'true';
            core.info(`Received inputs: dry_run=${process.env.DRY_RUN}, confirm_delete=${process.env.CONFIRM_DELETE}`);

            if (!dryRun && !confirmed) {
              core.setFailed('Deletion blocked: set confirm_delete=true as well as dry_run=false.');
              return;
            }

            const { owner, repo } = context.repo;
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner, repo, per_page: 100 }
            );

            core.info(`Repository: ${owner}/${repo}`);
            core.info(`Artifacts found: ${artifacts.length}`);
            core.info(`Mode: ${dryRun ? 'DRY RUN — no deletion' : 'DELETE ALL'}`);

            let bytes = 0;
            for (const artifact of artifacts) {
              bytes += artifact.size_in_bytes || 0;
              core.info(`${dryRun ? '[WOULD DELETE]' : '[DELETING]'} id=${artifact.id} name=${artifact.name} size=${artifact.size_in_bytes} created=${artifact.created_at} expired=${artifact.expired}`);
              if (!dryRun) {
                await github.rest.actions.deleteArtifact({
                  owner,
                  repo,
                  artifact_id: artifact.id
                });
              }
            }

            const mib = (bytes / 1024 / 1024).toFixed(2);
            core.summary
              .addHeading('Delete all Actions artifacts')
              .addTable([
                [{data:'Metric',header:true},{data:'Value',header:true}],
                ['Artifacts found', String(artifacts.length)],
                ['Total listed size', `${mib} MiB`],
                ['Mode', dryRun ? 'Dry run — nothing deleted' : 'Deletion confirmed']
              ])
              .addList(artifacts.map(a => `${a.name} (ID ${a.id}, ${(a.size_in_bytes / 1024 / 1024).toFixed(2)} MiB, ${a.created_at})`))
              .write();

            core.info(dryRun
              ? 'Preview complete. Review the list, then rerun with dry_run=false and confirm_delete=true to delete every listed artifact.'
              : `Deleted ${artifacts.length} artifacts.`);
